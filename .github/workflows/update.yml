name: Update festivity data

on:
  schedule:
    # GitHub can delay or drop scheduled runs when busy, so run twice a day.
    # A second run on the same day just refreshes that day's data.
    - cron: "17 6 * * *"   # 06:17 UTC
    - cron: "43 13 * * *"  # 13:43 UTC (backup)
  workflow_dispatch:       # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["site/**"]     # redeploy when the site itself changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: festivity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch Google Trends data
        if: github.event_name != 'push'
        env:
          TRENDS_GEO: ${{ vars.TRENDS_GEO || 'GB' }}
        run: |
          pip install -r requirements.txt
          python scripts/fetch_trends.py

      - name: Commit data and archive
        if: github.event_name != 'push'
        run: |
          git config user.name "festivity-bot"
          git config user.email "festivity-bot@users.noreply.github.com"
          git add site/data/trends.json data/archive
          git diff --cached --quiet || git commit -m "Update festivity data $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
